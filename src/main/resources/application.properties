server.port=8080

# Application Name
spring.application.name=sharemile

# Database Configuration (MySQL via XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/sharemile_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Secret Configuration
sharemile.jwt.secret=9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3e5f7a9b2c4d6e8f0a2b4c6d8e0f2a4b6c
sharemile.jwt.expiration-ms=86400000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# WebSocket settings
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
